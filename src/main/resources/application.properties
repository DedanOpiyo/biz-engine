# Your own identity configuration
app.jwt.issuer=https://superapp.com
# Path or string content of your local public key used to verify tokens your app issued
app.jwt.public-key-path=classpath:certs/public.der

# External Partner configuration (Add as many external partners as needed). # Now enlisted in externalissuer db
external.provider.issuer=https://external-auth-service.com
external.provider.jwk-set-uri=https://external-auth-service.com


# The exact secret key used by Node.js to sign JWTs (min 32 characters)
app.jwt.secret=${JWT_SECRET:slSeDB6Dn4k2C3qhL8sZfxPvdNKOIs7kMzz}

# Server Port
server.port=${SERVER_PORT:8080}

# For postgresql dependency
#spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Read from environment / .env with safe fallbacks
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/biz_engine}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:biz_engine}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:change-me-local}}

